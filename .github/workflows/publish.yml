name: Publish

# Publishes to crates.io when a version tag is pushed:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Uses crates.io trusted publishing: this workflow is registered with the crate
# on crates.io, and exchanges GitHub's identity token for a short-lived
# crates.io token, so no API token is stored in the repository.
#
# Running it by hand (Actions > Publish > Run workflow) is always a dry run: it
# does everything but the upload, to check the workflow before a release.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: ${{ github.event_name == 'push' && 'Publish to crates.io' || 'Publish dry run' }}
    runs-on: ubuntu-latest
    # Settings > Environments > crates-io can require an approval before this runs.
    # If the trusted publisher on crates.io names an environment, it must be this one.
    environment: crates-io
    permissions:
      contents: read
      # Lets the job request the identity token that trusted publishing needs.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check the tag matches the crate version
        if: github.event_name == 'push'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi

      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings

      - name: Get a crates.io token
        if: github.event_name == 'push'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        if: github.event_name == 'push'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish (dry run)
        if: github.event_name != 'push'
        run: cargo publish --dry-run
