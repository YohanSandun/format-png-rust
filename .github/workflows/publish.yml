name: Publish

# Publishes to crates.io when a version tag is pushed:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Needs a `CARGO_REGISTRY_TOKEN` secret: a crates.io API token with the
# publish-update scope (and publish-new for the first release), added under
# Settings > Secrets and variables > Actions.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Settings > Environments > crates-io can require an approval before this runs.
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi

      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
