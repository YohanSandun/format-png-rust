[package]
name = "format-png"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A PNG decoder and encoder in pure Rust: every color type, bit depth and interlacing, metadata, raw chunk access, and smaller files."
license = "MIT"
repository = "https://github.com/YohanSandun/format-png-rust"
readme = "README.md"
keywords = ["png", "image", "decoder", "encoder", "codec"]
categories = ["multimedia::images", "multimedia::encoding", "encoding", "parser-implementations"]
exclude = [".github/", "benches/data/", "**/__pycache__/", ".idea/", "*.iml"]

[dependencies]
rust-deflate = "0.4.0"

# A plain program with its own `main`; see benches/README.md.
[[bench]]
name = "decode"
harness = false
